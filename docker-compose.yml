version: '3.9'

services:
  ai-multicloud-agent:
    build: .
    container_name: ai-multicloud-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./src:/app/src
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Opcional: Redis para cache/filas (futuro)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"