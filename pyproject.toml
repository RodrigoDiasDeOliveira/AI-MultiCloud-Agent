[project]
name = "ai-multicloud-agent"
version = "0.1.0"
description = "MCP Server completo para gerenciamento multi-cloud com AI Agents (AWS, Azure, GCP, Oracle OCI)"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.105.0",
    "mcp>=1.27.0",
    "fastmcp",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "structlog>=25.1",
    "rich>=14.0",
    "typer>=0.15",
    "httpx>=0.28",
    "boto3>=1.37",
    "azure-identity>=1.20",
    "azure-mgmt-compute>=34.0",
    "azure-mgmt-storage>=22.0",
    "azure-mgmt-network>=28.0",
    "azure-mgmt-rdbms>=10.1.1",
    "azure-mgmt-cosmosdb>=9.0",
    "azure-mgmt-monitor>=7.0",
    "google-cloud-compute>=1.20",
    "google-cloud-storage>=3.0",
    "google-cloud-monitoring>=2.25",
    "oci>=2.140",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
