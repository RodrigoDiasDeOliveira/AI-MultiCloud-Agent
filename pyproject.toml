[project]
name = "ai-multicloud-agent"
version = "0.2.0"
description = "MCP Server completo para gerenciamento multi-cloud com AI Agents (AWS, Azure, GCP, Oracle OCI)"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.15",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastmcp>=3.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.35", "botocore"]
azure = ["azure-identity>=1.19", "azure-mgmt-compute", "azure-mgmt-storage", "azure-mgmt-network"]
gcp = ["google-cloud-compute>=1.20", "google-cloud-storage", "google-auth"]
oci = ["oci>=2.140"]
security = ["keyring>=25.0"]
dev = ["pytest", "ruff", "black", "mypy", "pre-commit"]
mcp = ["fastmcp>=3.2"]
frontend = ["streamlit>=1.38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
ai-multicloud-agent = "ai_multicloud_agent.main:cli"
